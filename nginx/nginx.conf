worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 20M;

    # Journalise l'adresse (IP:port du conteneur) du réplica "web" qui a
    # effectivement traité chaque requête -> sert à vérifier empiriquement
    # la répartition de charge entre répliques (docker compose up --scale
    # web=3 ; voir aussi le header X-Upstream-Addr ci-dessous).
    log_format upstream_log '$remote_addr - [$time_local] "$request" '
                             '$status $body_bytes_sent upstream=$upstream_addr';
    access_log /var/log/nginx/access.log upstream_log;

    # Résolveur DNS interne de Docker : utilisé pour résoudre "web" à
    # CHAQUE requête (via la variable $backend ci-dessous) plutôt qu'une
    # seule fois au démarrage de nginx. Avec plusieurs répliques du
    # service "web" (mêmes alias réseau Docker), le DNS interne renvoie
    # une adresse différente à tour de rôle -> répartition round-robin
    # sans avoir à lister les répliques à l'avance ni à recharger nginx
    # quand leur nombre change.
    resolver 127.0.0.11 valid=10s;

    server {
        listen 80;

        # Fichiers statiques collectés par `collectstatic` (migrate.sh),
        # servis directement par nginx plutôt que de transiter par
        # Gunicorn -- via le même bind mount que le service web
        # (docker-compose.yml : .:/app, STATIC_ROOT = /app/staticfiles).
        location /static/ {
            alias /app/staticfiles/;
        }

        location / {
            set $backend http://web:8000;
            proxy_pass $backend;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # Expose, côté client, quel réplica "web" a traité la requête
            # (vérification empirique de la répartition de charge).
            add_header X-Upstream-Addr $upstream_addr always;
        }
    }
}
