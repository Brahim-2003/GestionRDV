# pytest.ini
[pytest]
DJANGO_SETTINGS_MODULE = GestionRDV.settings
python_files = tests.py test_*.py *_tests.py

# --create-db (pytest-django) force la RECRÉATION de la base de test à
# chaque run, même si quelqu'un tape --reuse-db en local pour aller plus
# vite (pytest-django donne priorité à --create-db sur --reuse-db, voir
# pytest_django/fixtures.py::django_db_setup : keepdb=True seulement si
# reuse_db ET PAS create_db). Sans ça, le comportement par défaut de
# pytest-django (pas de --reuse-db) recrée déjà la base au premier run,
# mais un --reuse-db ajouté ponctuellement par confort de dev peut faire
# persister une base de test partiellement migrée d'un run à l'autre.
#
# Motif concret : le commit ae8eab9 a ajouté dans users/admin.py un
# `from .signals import RoleChangeBlocked`. Effet de bord invisible dans
# ce diff : ça fait charger users/signals.py (et connecter son receiver
# post_migrate create_default_groups_and_permissions) pendant
# l'autodiscover de django.contrib.admin — la toute première app
# d'INSTALLED_APPS — donc AVANT que django.contrib.auth.AuthConfig.ready()
# (app suivante) ait connecté create_permissions. Résultat : sur une base
# migrée FRAÎCHEMENT depuis zéro, notre receiver s'exécute avant celui de
# Django, cherche une permission qui n'existe pas encore, obtient None, et
# plante (IntegrityError sur auth_group_permissions). Ce chemin ne
# s'exerce QUE quand la base de test est réellement recréée à vide ; une
# base de test réutilisée d'un run à l'autre (créée avant ce commit, ou
# après un --reuse-db ponctuel) masque silencieusement ce genre de
# régression au lieu de la faire échouer. --create-db garantit que chaque
# run de la suite complète retombe systématiquement dans ce cas (le
# correctif du bug lui-même est dans users/signals.py, voir son
# commentaire sur create_default_groups_and_permissions).
addopts = --create-db
